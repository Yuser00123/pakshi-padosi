services:
  - type: web
    name: pakshi-padosi
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: LLM_MODEL
        value: gemma-4-31b-it
      - key: LLM_API_KEY
        sync: false
      - key: TOWN_DEFAULT
        value: Raebareli
      - key: TOWN_COORDS
        value: "26.2087, 81.2186"
      - key: REPO_URL
        value: https://github.com/Yuser00123/pakshi-padosi
      - key: GRADIO_ANALYTICS_ENABLED
        value: "False"
